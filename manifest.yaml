version: 0.0.1
type: plugin
author: lfenghx
name: claude_agent
label:
  en_US: Claude_Agent
  ja_JP: Claude_Agent
  zh_Hans: Claude_Agent
  pt_BR: Claude_Agent
description:
  en_US: Claude_Agent is an Agent plugin built on claude_agent_sdk that delegates tool calling, turn limiting and permissions to the SDK.
  ja_JP: Claude_Agent は claude_agent_sdk 上に構築された Agent プラグインで、ツール呼び出し、ターン制限、権限を SDK に委譲します。
  zh_Hans: 基于 claude_agent_sdk 的 Agent 插件，将工具调用、轮数控制与权限管理委托给 SDK
  pt_BR: Claude_Agent é um plugin de Agent construído sobre o claude_agent_sdk que delega chamadas de ferramenta, limite de turnos e permissões ao SDK.
icon: icon.svg
icon_dark: icon-dark.svg
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
    model:
      enabled: true
      llm: true
      text_embedding: false
      rerank: false
      tts: false
      speech2text: false
      moderation: false
    endpoint:
      enabled: true
    app:
      enabled: true
    storage:
      enabled: true
      size: 104857600
plugins:
  tools:
    - provider/claude_agent.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: null
created_at: 2026-07-25T14:00:00+08:00
privacy: PRIVACY.md
verified: false
